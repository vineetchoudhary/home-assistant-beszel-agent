name: Build and Publish

on:
  # Check for new releases every 8 hours
  schedule:
    - cron: '0 */8 * * *'
  # Allow manual trigger with image type selection
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Image type to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - stable
          - smart
          - intel
          - amd
          - nvidia
          - hub
      force_rebuild:
        description: 'Force rebuild even if version is up-to-date'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Determine trigger type
        id: trigger_type
        run: |
          # Determine which image to build based on changed files
          IMAGE_TYPE="all"
          
          # Branch pushes do not currently trigger this workflow (see the `on:` block),
          # so this only runs if a `branches:` filter is added there.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != refs/tags/* ]]; then
            # Check which files changed
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
            
            for pair in \
              "beszel_agent_nvidia:nvidia" \
              "beszel_agent_intel:intel" \
              "beszel_agent_smart:smart" \
              "beszel_agent_amd:amd" \
              "beszel_hub:hub"; do
              dir="${pair%%:*}"
              id="${pair##*:}"
              if echo "$CHANGED_FILES" | grep -q "^${dir}/"; then
                IMAGE_TYPE="${id}"
                echo "Detected changes in ${dir} - building ${id} only"
                break
              fi
            done
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "type=tag" >> $GITHUB_OUTPUT
            echo "This is a tag-based release - building all images with the Beszel version pinned in the repository"
            IMAGE_TYPE="all"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "type=scheduled" >> $GITHUB_OUTPUT
            echo "This is a scheduled check"
          else
            echo "type=manual" >> $GITHUB_OUTPUT
            echo "This is a manual trigger"
            # Use input image_type if provided, otherwise use detected IMAGE_TYPE
            if [[ -n "${{ inputs.image_type }}" ]]; then
              IMAGE_TYPE="${{ inputs.image_type }}"
            fi
            echo "Image type: ${IMAGE_TYPE}"
            echo "Force rebuild: ${{ inputs.force_rebuild || 'false' }}"
          fi
          
          echo "image_type=${IMAGE_TYPE}" >> $GITHUB_OUTPUT

      - name: Get latest release version
        id: get_version
        run: |
          # Use GitHub token to avoid rate limiting
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/henrygd/beszel/releases/latest)
          
          # Check if response is valid JSON
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Error: Failed to fetch release info from GitHub API"
            echo "$RESPONSE"
            exit 1
          fi
          
          VERSION=$(echo "$RESPONSE" | jq -r .tag_name)
          
          # Check if we got a valid version
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Could not extract version from API response"
            exit 1
          fi
          
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "Latest Beszel version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve app and upstream versions
        id: resolve_versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_APP_VERSION="$(grep '^version:' beszel_agent/config.yaml | sed -E 's/version: "(.*)"/\1/')"
          CURRENT_BESZEL_VERSION="$(tr -d '[:space:]' < beszel_agent/beszel_version)"
          LATEST_BESZEL_VERSION="${{ steps.get_version.outputs.VERSION }}"

          if [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
            APP_VERSION="${TAG_VERSION}"
            BESZEL_VERSION="${CURRENT_BESZEL_VERSION}"
            echo "Tag-based release detected"
            echo "Using app/image version from git tag: ${APP_VERSION}"
            echo "Using upstream Beszel version from repo state: ${BESZEL_VERSION}"
          elif [[ "${{ steps.trigger_type.outputs.type }}" == "manual" && "${{ steps.trigger_type.outputs.image_type }}" != "all" ]]; then
            # Rebuilding one app must not bump it past the others: all apps
            # share a single version, and an upstream bump is the job of a full
            # ("all") or scheduled run.
            APP_VERSION="${CURRENT_APP_VERSION}"
            BESZEL_VERSION="${CURRENT_BESZEL_VERSION}"
            echo "Single app rebuild - holding the current repository version"
            echo "Using app/image version: ${APP_VERSION}"
            echo "Using upstream Beszel version: ${BESZEL_VERSION}"
          elif [[ "${LATEST_BESZEL_VERSION}" != "${CURRENT_BESZEL_VERSION}" ]]; then
            APP_VERSION="${LATEST_BESZEL_VERSION}"
            BESZEL_VERSION="${LATEST_BESZEL_VERSION}"
            echo "Upstream Beszel update detected"
            echo "Using app/image version: ${APP_VERSION}"
            echo "Using upstream Beszel version: ${BESZEL_VERSION}"
          else
            APP_VERSION="${CURRENT_APP_VERSION}"
            BESZEL_VERSION="${CURRENT_BESZEL_VERSION}"
            echo "No upstream Beszel change detected"
            echo "Using app/image version: ${APP_VERSION}"
            echo "Using upstream Beszel version: ${BESZEL_VERSION}"
          fi

          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "BESZEL_VERSION=${BESZEL_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if config file version is up-to-date
        id: check_version
        run: |
          CONFIG_VERSION=$(grep '^version:' beszel_agent/config.yaml | sed -E 's/version: "(.*)"/\1/')
          echo "Config version: $CONFIG_VERSION"
          
          # For manual triggers with force_rebuild, always proceed
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            echo "Force rebuild enabled: Building images"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          # For tag-based releases, always build with the tag version
          elif [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
            echo "Tag-based release: Building app version ${{ steps.resolve_versions.outputs.APP_VERSION }}"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          # A manual run that names one app is an explicit request to build it,
          # so don't fall through to the "already up-to-date" skip.
          elif [[ "${{ steps.trigger_type.outputs.type }}" == "manual" && "${{ steps.trigger_type.outputs.image_type }}" != "all" ]]; then
            echo "Manual ${{ steps.trigger_type.outputs.image_type }} build requested"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          elif [ "$CONFIG_VERSION" = "${{ steps.resolve_versions.outputs.APP_VERSION }}" ]; then
            echo "Version is up-to-date. Skipping further steps."
            echo "run_steps=false" >> $GITHUB_OUTPUT
          else
            echo "Version is outdated. Proceeding with updates."
            echo "run_steps=true" >> $GITHUB_OUTPUT
          fi
      - name: Update app versions
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          # Discovered rather than listed, so adding an app directory is enough.
          APP_DIRS=$(find . -maxdepth 2 -name config.yaml -path './beszel_*' -exec dirname {} \; | sed 's|^\./||' | sort)

          printf '# Changelog\n\n[View GitHub release v%s](https://github.com/%s/releases/tag/v%s)\n' \
            "${{ steps.resolve_versions.outputs.APP_VERSION }}" \
            "${{ github.repository }}" \
            "${{ steps.resolve_versions.outputs.APP_VERSION }}" \
            > /tmp/CHANGELOG.md

          for dir in ${APP_DIRS}; do
            sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.APP_VERSION }}\"/" "${dir}/config.yaml"
            printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > "${dir}/beszel_version"
            cp /tmp/CHANGELOG.md "${dir}/CHANGELOG.md"
          done

          echo "Updated app version to ${{ steps.resolve_versions.outputs.APP_VERSION }}"
          echo "Updated upstream Beszel version to ${{ steps.resolve_versions.outputs.BESZEL_VERSION }}"

      - name: Login to GitHub Container Registry
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Prepare build helpers
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          # ------------------------------------------------------------------
          # App table. One row per app:
          #   id | directory | image suffix | platforms | base | smoke test
          # `id` doubles as the workflow_dispatch image_type value.
          # `base` selects the Home Assistant base image; both are multi-arch,
          # which is what lets a single build produce a multi-arch manifest.
          # ------------------------------------------------------------------
          cat > /tmp/apps.tsv <<'EOF'
          stable	beszel_agent	home-assistant-beszel-agent	linux/amd64,linux/arm64	alpine	agent
          smart	beszel_agent_smart	home-assistant-beszel-agent-smart	linux/amd64,linux/arm64	alpine	agent
          intel	beszel_agent_intel	home-assistant-beszel-agent-intel	linux/amd64	alpine	agent
          amd	beszel_agent_amd	home-assistant-beszel-agent-amd	linux/amd64,linux/arm64	alpine	agent
          nvidia	beszel_agent_nvidia	home-assistant-beszel-agent-nvidia	linux/amd64,linux/arm64	debian	agent
          hub	beszel_hub	home-assistant-beszel-hub	linux/amd64,linux/arm64	alpine	hub
          EOF
          echo "App table:"
          cat /tmp/apps.tsv

          # Emit the rows selected by the requested image type ("all" selects everything).
          cat > /tmp/select-apps.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          want="${1:-all}"
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            if [ "${want}" = "all" ] || [ "${want}" = "${id}" ]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "${id}" "${dir}" "${suffix}" "${platforms}" "${base}" "${test_kind}"
            fi
          done < /tmp/apps.tsv
          EOF

          # Build one app image. Multi-platform builds must be pushed, because a
          # manifest list cannot be loaded into the local Docker image store.
          cat > /tmp/build-app-image.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          image="$1"
          context_dir="$2"
          version="$3"
          platforms="$4"
          base="$5"
          tag_latest="${6:-false}"
          output_mode="${7:-push}"

          case "${base}" in
            alpine) build_from="ghcr.io/home-assistant/base:latest" ;;
            debian) build_from="ghcr.io/home-assistant/base-debian:latest" ;;
            *)
              echo "Unsupported base: ${base}" >&2
              exit 1
              ;;
          esac

          case "${output_mode}" in
            push) output_flag="--push" ;;
            load) output_flag="--load" ;;
            *)
              echo "Unsupported output mode: ${output_mode}" >&2
              exit 1
              ;;
          esac

          if [ "${output_mode}" = "load" ] && [ "${platforms}" != "${platforms#*,}" ]; then
            echo "Cannot --load a multi-platform build; pass a single platform" >&2
            exit 1
          fi

          tags=(-t "${image}:${version}")
          if [ "${tag_latest}" = "true" ]; then
            tags+=(-t "${image}:latest")
          fi

          # io.hass.arch is deliberately not set: a multi-arch build would stamp the
          # same value onto every platform. Supervisor validates the real image
          # architecture, and only reads the label informationally.
          docker buildx build \
            --platform "${platforms}" \
            --pull \
            --provenance=false \
            --sbom=false \
            --build-arg "BUILD_FROM=${build_from}" \
            --build-arg "BUILD_VERSION=${version}" \
            --label "io.hass.version=${version}" \
            --label "io.hass.type=addon" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            "${tags[@]}" \
            "${output_flag}" \
            "${context_dir}"
          EOF

          chmod +x /tmp/build-app-image.sh /tmp/select-apps.sh

      - name: Build and smoke test images
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          VERSION="${{ steps.resolve_versions.outputs.APP_VERSION }}"
          IMAGE_TYPE="${{ steps.trigger_type.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          SELECTED=$(/tmp/select-apps.sh "${IMAGE_TYPE}")
          if [ -z "${SELECTED}" ]; then
            echo "No apps matched image type '${IMAGE_TYPE}'"
            exit 1
          fi

          # Smoke tests build a single platform straight into the local Docker store,
          # so an image that fails its test never reaches the registry.
          port=18090
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            IMAGE="ghcr.io/vineetchoudhary/${suffix}"
            echo "::group::Build and test ${id} (${dir})"

            # First platform in the row. A manifest list cannot be --load'ed, so the
            # smoke test always builds exactly one platform.
            smoke_platform="${platforms%%,*}"
            /tmp/build-app-image.sh "${IMAGE}" "${dir}" "${VERSION}" "${smoke_platform}" "${base}" "false" "load"

            case "${test_kind}" in
              agent)
                CONTAINER_ID=$(docker run -d \
                  -e BESZEL_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEVS7RCrzT7kxYP9+bcALqVpvX3apD8u7OOfwlGfYkXR test@github-actions" \
                  -e BESZEL_HUB_URL="http://0.0.0.0" \
                  -e BESZEL_TOKEN="test-token-for-ci" \
                  "${IMAGE}:${VERSION}")

                sleep 8
                LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
                echo "${LOGS}"
                STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
                EXIT_CODE=$(docker inspect "${CONTAINER_ID}" --format='{{.State.ExitCode}}')
                docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true

                if ! echo "${LOGS}" | grep -q "Starting Beszel Agent"; then
                  echo "✗ ${id}: agent did not start"
                  exit 1
                fi
                if echo "${LOGS}" | grep -q "cannot execute: required file not found"; then
                  echo "✗ ${id}: binary execution failed (architecture or libc mismatch)"
                  exit 1
                fi
                if ! echo "${LOGS}" | grep -q "Starting Beszel Agent on port 45876"; then
                  echo "✗ ${id}: agent did not reach its listen port"
                  exit 1
                fi
                if [ "${STATUS}" != "running" ]; then
                  echo "✗ ${id}: container exited with code ${EXIT_CODE}"
                  exit 1
                fi
                ;;
              hub)
                CONTAINER_ID=$(docker run -d -p "${port}:8090" "${IMAGE}:${VERSION}")

                healthy=false
                for attempt in $(seq 1 30); do
                  if curl -fsS "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1; then
                    healthy=true
                    echo "Health endpoint responded after ${attempt} attempt(s)"
                    break
                  fi
                  sleep 2
                done

                LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
                echo "${LOGS}"
                STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
                docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true
                port=$((port + 1))

                if ! echo "${LOGS}" | grep -q "Starting Beszel Hub"; then
                  echo "✗ ${id}: hub did not start"
                  exit 1
                fi
                if [ "${healthy}" != "true" ]; then
                  echo "✗ ${id}: health endpoint did not respond"
                  exit 1
                fi
                if [ "${STATUS}" != "running" ]; then
                  echo "✗ ${id}: container is not running"
                  exit 1
                fi
                ;;
            esac

            docker rmi "${IMAGE}:${VERSION}" >/dev/null 2>&1 || true
            echo "✓ Test passed for ${id}"
            echo "::endgroup::"
          done <<< "${SELECTED}"

      - name: Publish images
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          VERSION="${{ steps.resolve_versions.outputs.APP_VERSION }}"
          IMAGE_TYPE="${{ steps.trigger_type.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          # One build per app emits a multi-arch manifest, so config.yaml can
          # reference a single image name with no {arch} placeholder.
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            IMAGE="ghcr.io/vineetchoudhary/${suffix}"
            echo "::group::Publish ${id} (${platforms})"
            /tmp/build-app-image.sh "${IMAGE}" "${dir}" "${VERSION}" "${platforms}" "${base}" "true" "push"
            echo "::endgroup::"
          done <<< "$(/tmp/select-apps.sh "${IMAGE_TYPE}")"

      - name: Commit app version update
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          git config --global user.name "Developer Insider Bot"
          git config --global user.email "bot@developerinsider.co"

          IMAGE_TYPE="${{ steps.trigger_type.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          # Only stage the apps this run actually published, so a single-app
          # build never commits version bumps for images it did not build.
          SELECTED_DIRS=""
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            git add "${dir}/config.yaml" "${dir}/beszel_version" "${dir}/CHANGELOG.md"
            SELECTED_DIRS="${SELECTED_DIRS} ${dir}"
          done <<< "$(/tmp/select-apps.sh "${IMAGE_TYPE}")"
          echo "Staged:${SELECTED_DIRS}"

          # Discard the version bumps written for apps this run did not build.
          # Scoped to those directories rather than the whole tree on purpose.
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${dir}" ] || continue
            case " ${SELECTED_DIRS} " in
              *" ${dir} "*) continue ;;
            esac
            git checkout -- "${dir}" 2>/dev/null || true
            echo "Reverted unbuilt ${dir}"
          done < /tmp/apps.tsv

          if [ "${IMAGE_TYPE}" = "all" ]; then
            if [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
              COMMIT_MSG="Release ${{ github.ref_name }}: App ${APP_VERSION}, Beszel ${BESZEL_VERSION}"
            else
              COMMIT_MSG="Update app ${APP_VERSION} to Beszel ${BESZEL_VERSION}"
            fi
          else
            COMMIT_MSG="Update ${IMAGE_TYPE} app ${APP_VERSION} to Beszel ${BESZEL_VERSION}"
          fi

          git commit -m "$COMMIT_MSG" || echo "No changes to commit"

          # Don't push on tag releases (avoid recursion)
          if [[ "${{ steps.trigger_type.outputs.type }}" != "tag" ]]; then
            git push
          else
            echo "Skipping push for tag-based release"
          fi
        env:
          APP_VERSION: ${{ steps.resolve_versions.outputs.APP_VERSION }}
          BESZEL_VERSION: ${{ steps.resolve_versions.outputs.BESZEL_VERSION }}

      - name: Create Git Tag
        if: steps.check_version.outputs.run_steps == 'true' && steps.trigger_type.outputs.type != 'tag' && steps.trigger_type.outputs.image_type == 'all' && inputs.force_rebuild != true
        run: |
          VERSION="${{ steps.resolve_versions.outputs.APP_VERSION }}"
          TAG="v${VERSION}"
          
          git tag -a "${TAG}" -m "Release ${TAG}: Update to Beszel ${VERSION}"
          git push origin "${TAG}"

          echo "Created and pushed tag: ${TAG}"

      - name: Create GitHub Release
        if: steps.check_version.outputs.run_steps == 'true' && steps.trigger_type.outputs.type != 'tag' && steps.trigger_type.outputs.image_type == 'all' && inputs.force_rebuild != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.resolve_versions.outputs.APP_VERSION }}
          BESZEL_VERSION: ${{ steps.resolve_versions.outputs.BESZEL_VERSION }}
        run: |
          gh release create "v${APP_VERSION}" \
            --title "Release v${APP_VERSION}" \
            --notes "## Changes
          - Updated Beszel apps to version ${APP_VERSION}
          - Upstream release notes: https://github.com/henrygd/beszel/releases/tag/v${BESZEL_VERSION}"
