name: Build and Publish

on:
  # Check for new releases every 8 hours
  schedule:
    - cron: '0 */8 * * *'
  # Allow manual trigger with image type selection
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Apps to publish (all-except-bridge skips Bridge)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - all-except-bridge
          - stable
          - smart
          - intel
          - amd
          - nvidia
          - hub
          - bridge
      bridge_version:
        description: 'Bridge-only release version (blank rebuilds its current version)'
        required: false
        default: ''
        type: string
      force_rebuild:
        description: 'Force rebuild even if version is up-to-date'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get latest release version
        id: get_version
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.image_type == 'all' || inputs.image_type == 'all-except-bridge'))
        run: |
          # Use GitHub token to avoid rate limiting
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/henrygd/beszel/releases/latest)
          
          # Check if response is valid JSON
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Error: Failed to fetch release info from GitHub API"
            echo "$RESPONSE"
            exit 1
          fi
          
          VERSION=$(echo "$RESPONSE" | jq -r .tag_name)
          
          # Check if we got a valid version
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Could not extract version from API response"
            exit 1
          fi
          
          VERSION="${VERSION#v}"
          echo "Latest Beszel version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Plan release scope and versions
        id: plan
        env:
          IMAGE_TYPE: ${{ inputs.image_type }}
          BRIDGE_VERSION: ${{ inputs.bridge_version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          LATEST_BESZEL_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 -B scripts/release-plan.py \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --image-type "$IMAGE_TYPE" --bridge-version "$BRIDGE_VERSION" \
            --force-rebuild "$FORCE_REBUILD" --latest-beszel "$LATEST_BESZEL_VERSION" \
            --output "$GITHUB_OUTPUT"

      - name: Verify Bridge compatibility before releasing
        if: steps.plan.outputs.verify_bridge == 'true'
        run: |
          python3 -B scripts/test-ci-runners.py
          chmod +x scripts/test-bridge.sh
          ./scripts/test-bridge.sh --hub-version "${{ steps.plan.outputs.BESZEL_VERSION }}"
          python3 scripts/test-bridge-e2e.py --build --hub-version "${{ steps.plan.outputs.BESZEL_VERSION }}"

      - name: Login to GitHub Container Registry
        if: steps.plan.outputs.run_steps == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.plan.outputs.run_steps == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.plan.outputs.run_steps == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Prepare build helpers
        if: steps.plan.outputs.run_steps == 'true'
        run: |
          # ------------------------------------------------------------------
          # App table. One row per app:
          #   id | directory | image suffix | platforms | base | smoke test
          # `id` doubles as the workflow_dispatch image_type value.
          # `base` selects the Home Assistant base image; both are multi-arch,
          # which is what lets a single build produce a multi-arch manifest.
          # ------------------------------------------------------------------
          cat > /tmp/apps.tsv <<'EOF'
          stable	beszel_agent	home-assistant-beszel-agent	linux/amd64,linux/arm64	alpine	agent
          smart	beszel_agent_smart	home-assistant-beszel-agent-smart	linux/amd64,linux/arm64	alpine	agent
          intel	beszel_agent_intel	home-assistant-beszel-agent-intel	linux/amd64	alpine	agent
          amd	beszel_agent_amd	home-assistant-beszel-agent-amd	linux/amd64,linux/arm64	alpine	agent
          nvidia	beszel_agent_nvidia	home-assistant-beszel-agent-nvidia	linux/amd64,linux/arm64	debian	agent
          hub	beszel_hub	home-assistant-beszel-hub	linux/amd64,linux/arm64	alpine	hub
          bridge	beszel_bridge	home-assistant-beszel-bridge	linux/amd64,linux/arm64	alpine	bridge
          EOF
          echo "App table:"
          cat /tmp/apps.tsv

          # Use the same app selection for version updates, tests, publication and commits.
          cat > /tmp/select-apps.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          want="${1:-all}"
          apps_table="$(dirname "$0")/apps.tsv"
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            if [ "${want}" = "all" ] || [ "${want}" = "${id}" ] || { [ "${want}" = "all-except-bridge" ] && [ "${id}" != "bridge" ]; }; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "${id}" "${dir}" "${suffix}" "${platforms}" "${base}" "${test_kind}"
            fi
          done < "${apps_table}"
          EOF

          # Build one app image. Multi-platform builds must be pushed, because a
          # manifest list cannot be loaded into the local Docker image store.
          cat > /tmp/build-app-image.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          image="$1"
          context_dir="$2"
          version="$3"
          platforms="$4"
          base="$5"
          tag_latest="${6:-false}"
          output_mode="${7:-push}"

          case "${base}" in
            alpine) build_from="ghcr.io/home-assistant/base:latest" ;;
            debian) build_from="ghcr.io/home-assistant/base-debian:latest" ;;
            *)
              echo "Unsupported base: ${base}" >&2
              exit 1
              ;;
          esac

          case "${output_mode}" in
            push) output_flag="--push" ;;
            load) output_flag="--load" ;;
            *)
              echo "Unsupported output mode: ${output_mode}" >&2
              exit 1
              ;;
          esac

          if [ "${output_mode}" = "load" ] && [ "${platforms}" != "${platforms#*,}" ]; then
            echo "Cannot --load a multi-platform build; pass a single platform" >&2
            exit 1
          fi

          tags=(-t "${image}:${version}")
          if [ "${tag_latest}" = "true" ]; then
            tags+=(-t "${image}:latest")
          fi

          hass_type="addon"
          if [ "$(basename "${context_dir}")" = "beszel_bridge" ]; then
            hass_type="app"
          fi

          # io.hass.arch is deliberately not set: a multi-arch build would stamp the
          # same value onto every platform. Supervisor validates the real image
          # architecture, and only reads the label informationally.
          docker buildx build \
            --platform "${platforms}" \
            --pull \
            --provenance=false \
            --sbom=false \
            --build-arg "BUILD_FROM=${build_from}" \
            --build-arg "BUILD_VERSION=${version}" \
            --label "io.hass.version=${version}" \
            --label "io.hass.type=${hass_type}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            "${tags[@]}" \
            "${output_flag}" \
            "${context_dir}"
          EOF

          chmod +x /tmp/build-app-image.sh /tmp/select-apps.sh

      - name: Update selected app versions
        if: steps.plan.outputs.run_steps == 'true'
        env:
          APP_VERSION: ${{ steps.plan.outputs.APP_VERSION }}
          BRIDGE_APP_VERSION: ${{ steps.plan.outputs.BRIDGE_APP_VERSION }}
          BESZEL_VERSION: ${{ steps.plan.outputs.BESZEL_VERSION }}
          IMAGE_TYPE: ${{ steps.plan.outputs.image_type }}
          RELEASE_TAG: ${{ steps.plan.outputs.RELEASE_TAG }}
        run: |
          while IFS=$'\t' read -r id dir _suffix _platforms _base _test_kind; do
            [ -n "${id}" ] || continue
            version="${APP_VERSION}"
            if [ "${id}" = "bridge" ]; then
              version="${BRIDGE_APP_VERSION}"
            fi
            current_version="$(sed -nE 's/^version: "(.*)"$/\1/p' "${dir}/config.yaml")"
            version_file="$(mktemp)"
            sed "s/^version:.*/version: \"${version}\"/" "${dir}/config.yaml" > "${version_file}"
            cat "${version_file}" > "${dir}/config.yaml"
            rm -f "${version_file}"
            if [ "${id}" != "bridge" ]; then
              printf '%s\n' "${BESZEL_VERSION}" > "${dir}/beszel_version"
            fi
            # Keep existing release links and notes on rebuilds at the same version.
            if [ "${version}" != "${current_version}" ]; then
              tag="${RELEASE_TAG:-v${version}}"
              printf '# Changelog\n\n[View GitHub release %s](https://github.com/%s/releases/tag/%s)\n' \
                "${tag}" "${GITHUB_REPOSITORY}" "${tag}" > "${dir}/CHANGELOG.md"
            fi
            echo "Prepared ${dir} version ${version}"
          done <<< "$(/tmp/select-apps.sh "${IMAGE_TYPE}")"

      - name: Build and smoke test images
        if: steps.plan.outputs.run_steps == 'true'
        run: |
          IMAGE_TYPE="${{ steps.plan.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          SELECTED=$(/tmp/select-apps.sh "${IMAGE_TYPE}")
          if [ -z "${SELECTED}" ]; then
            echo "No apps matched image type '${IMAGE_TYPE}'"
            exit 1
          fi

          # Smoke tests build a single platform straight into the local Docker store,
          # so an image that fails its test never reaches the registry.
          port=18090
          while IFS=$'\t' read -r id dir suffix platforms base test_kind; do
            [ -n "${id}" ] || continue
            VERSION="$(sed -nE 's/^version: "(.*)"$/\1/p' "${dir}/config.yaml")"
            IMAGE="ghcr.io/vineetchoudhary/${suffix}"
            echo "::group::Build and test ${id} (${dir})"

            # First platform in the row. A manifest list cannot be --load'ed, so the
            # smoke test always builds exactly one platform.
            smoke_platform="${platforms%%,*}"
            /tmp/build-app-image.sh "${IMAGE}" "${dir}" "${VERSION}" "${smoke_platform}" "${base}" "false" "load"

            case "${test_kind}" in
              bridge)
                options_dir="$(mktemp -d)"
                printf '%s\n' '{"hub_url":"http://hub.invalid:8090","hub_email":"reader@example.com","hub_password":"ci-only-password","mqtt_source":"manual","mqtt_host":"broker.invalid","mqtt_port":1883,"poll_interval":30,"discovery_prefix":"homeassistant","ha_status_topic":"homeassistant/status"}' > "${options_dir}/options.json"
                CONTAINER_ID=$(docker run -d -e BESZEL_BRIDGE_CONFIG=/test-options.json \
                  -v "${options_dir}/options.json:/test-options.json:ro" "${IMAGE}:${VERSION}")
                healthy=false
                for attempt in $(seq 1 15); do
                  if docker exec "${CONTAINER_ID}" /usr/local/bin/bridge health; then
                    healthy=true
                    break
                  fi
                  sleep 1
                done
                STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
                docker logs "${CONTAINER_ID}"
                docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true
                rm -rf "${options_dir}"
                if [ "${healthy}" != "true" ] || [ "${STATUS}" != "running" ]; then
                  echo "Bridge must stay alive while its Hub is unavailable"
                  exit 1
                fi
                ;;
              agent)
                CONTAINER_ID=$(docker run -d \
                  -e BESZEL_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEVS7RCrzT7kxYP9+bcALqVpvX3apD8u7OOfwlGfYkXR test@github-actions" \
                  -e BESZEL_HUB_URL="http://0.0.0.0" \
                  -e BESZEL_TOKEN="test-token-for-ci" \
                  "${IMAGE}:${VERSION}")

                sleep 8
                LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
                echo "${LOGS}"
                STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
                EXIT_CODE=$(docker inspect "${CONTAINER_ID}" --format='{{.State.ExitCode}}')
                docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true

                if ! echo "${LOGS}" | grep -q "Starting Beszel Agent"; then
                  echo "✗ ${id}: agent did not start"
                  exit 1
                fi
                if echo "${LOGS}" | grep -q "cannot execute: required file not found"; then
                  echo "✗ ${id}: binary execution failed (architecture or libc mismatch)"
                  exit 1
                fi
                if ! echo "${LOGS}" | grep -q "Starting Beszel Agent on port 45876"; then
                  echo "✗ ${id}: agent did not reach its listen port"
                  exit 1
                fi
                if [ "${STATUS}" != "running" ]; then
                  echo "✗ ${id}: container exited with code ${EXIT_CODE}"
                  exit 1
                fi
                ;;
              hub)
                CONTAINER_ID=$(docker run -d -p "${port}:8090" "${IMAGE}:${VERSION}")

                healthy=false
                for attempt in $(seq 1 30); do
                  if curl -fsS "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1; then
                    healthy=true
                    echo "Health endpoint responded after ${attempt} attempt(s)"
                    break
                  fi
                  sleep 2
                done

                INGRESS_HTML=$(docker exec "${CONTAINER_ID}" curl -fsS \
                  -H "X-Ingress-Path: /api/hassio_ingress/TESTTOKEN" \
                  http://127.0.0.1:8099/ 2>/dev/null || true)

                LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
                echo "${LOGS}"
                STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
                docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true
                port=$((port + 1))

                if ! echo "${LOGS}" | grep -q "Starting Beszel Hub"; then
                  echo "✗ ${id}: hub did not start"
                  exit 1
                fi
                if [ "${healthy}" != "true" ]; then
                  echo "✗ ${id}: health endpoint did not respond"
                  exit 1
                fi
                if [ -z "${INGRESS_HTML}" ]; then
                  echo "✗ ${id}: Ingress proxy on port 8099 did not respond"
                  exit 1
                fi
                if ! echo "${INGRESS_HTML}" | grep -q '"BASE_PATH":"/api/hassio_ingress/TESTTOKEN/"'; then
                  echo "✗ ${id}: Ingress did not rewrite BASE_PATH"
                  exit 1
                fi
                if ! echo "${INGRESS_HTML}" | grep -q 'src="/api/hassio_ingress/TESTTOKEN/assets/'; then
                  echo "✗ ${id}: Ingress did not rewrite asset paths"
                  exit 1
                fi
                if [ "${STATUS}" != "running" ]; then
                  echo "✗ ${id}: container is not running"
                  exit 1
                fi
                ;;
            esac

            docker rmi "${IMAGE}:${VERSION}" >/dev/null 2>&1 || true
            echo "✓ Test passed for ${id}"
            echo "::endgroup::"
          done <<< "${SELECTED}"

      - name: Publish images
        if: steps.plan.outputs.run_steps == 'true'
        run: |
          IMAGE_TYPE="${{ steps.plan.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          # One build per app emits a multi-arch manifest, so config.yaml can
          # reference a single image name with no {arch} placeholder.
          while IFS=$'\t' read -r id dir suffix platforms base _test_kind; do
            [ -n "${id}" ] || continue
            VERSION="$(sed -nE 's/^version: "(.*)"$/\1/p' "${dir}/config.yaml")"
            IMAGE="ghcr.io/vineetchoudhary/${suffix}"
            echo "::group::Publish ${id} (${platforms})"
            /tmp/build-app-image.sh "${IMAGE}" "${dir}" "${VERSION}" "${platforms}" "${base}" "true" "push"
            echo "::endgroup::"
          done <<< "$(/tmp/select-apps.sh "${IMAGE_TYPE}")"

      - name: Commit app version update
        if: steps.plan.outputs.run_steps == 'true'
        run: |
          git config --global user.name "Developer Insider Bot"
          git config --global user.email "bot@developerinsider.co"

          IMAGE_TYPE="${{ steps.plan.outputs.image_type }}"
          [ -n "${IMAGE_TYPE}" ] || IMAGE_TYPE="all"

          # Only stage the apps this run actually published, so a single-app
          # build never commits version bumps for images it did not build.
          SELECTED_DIRS=""
          while IFS=$'\t' read -r id dir _suffix _platforms _base _test_kind; do
            [ -n "${id}" ] || continue
            git add "${dir}/config.yaml" "${dir}/CHANGELOG.md"
            if [ "${dir}" != "beszel_bridge" ]; then
              git add "${dir}/beszel_version"
            fi
            SELECTED_DIRS="${SELECTED_DIRS} ${dir}"
          done <<< "$(/tmp/select-apps.sh "${IMAGE_TYPE}")"
          echo "Staged:${SELECTED_DIRS}"

          if [ "${IMAGE_TYPE}" = "all" ] || [ "${IMAGE_TYPE}" = "all-except-bridge" ]; then
            if [[ "${{ steps.plan.outputs.type }}" == "tag" ]]; then
              COMMIT_MSG="Release ${{ github.ref_name }}: App ${APP_VERSION}, Beszel ${BESZEL_VERSION}"
            else
              COMMIT_MSG="Update app ${APP_VERSION} to Beszel ${BESZEL_VERSION}"
            fi
          else
            COMMIT_MSG="Update ${IMAGE_TYPE} app ${APP_VERSION} to Beszel ${BESZEL_VERSION}"
          fi

          git commit -m "$COMMIT_MSG" || echo "No changes to commit"

          # Don't push on tag releases (avoid recursion)
          if [[ "${{ steps.plan.outputs.type }}" != "tag" ]]; then
            git push
          else
            echo "Skipping push for tag-based release"
          fi
        env:
          APP_VERSION: ${{ steps.plan.outputs.APP_VERSION }}
          BESZEL_VERSION: ${{ steps.plan.outputs.BESZEL_VERSION }}

      - name: Create Git Tag
        if: steps.plan.outputs.RELEASE_TAG != ''
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.RELEASE_TAG }}
          RELEASE_NAME: ${{ steps.plan.outputs.RELEASE_NAME }}
        run: |
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_NAME}"
          git push origin "${RELEASE_TAG}"
          echo "Created and pushed tag: ${RELEASE_TAG}"

      - name: Create GitHub Release
        if: steps.plan.outputs.RELEASE_TAG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.RELEASE_TAG }}
          RELEASE_NAME: ${{ steps.plan.outputs.RELEASE_NAME }}
          APP_VERSION: ${{ steps.plan.outputs.APP_VERSION }}
          BRIDGE_APP_VERSION: ${{ steps.plan.outputs.BRIDGE_APP_VERSION }}
          BESZEL_VERSION: ${{ steps.plan.outputs.BESZEL_VERSION }}
          IMAGE_TYPE: ${{ steps.plan.outputs.image_type }}
        run: |
          notes="$(mktemp)"
          release_options=(--verify-tag)
          case "${IMAGE_TYPE}" in
            bridge)
              release_options+=(--latest=false)
              printf '## Changes\n- Updated Beszel Bridge to version %s\n- Tested with the repository-pinned Hub version %s\n' \
                "${BRIDGE_APP_VERSION}" "${BESZEL_VERSION}" > "${notes}"
              ;;
            all-except-bridge)
              printf '## Changes\n- Updated Beszel Agent and Hub apps to version %s\n- Bridge was excluded from this release\n' \
                "${APP_VERSION}" > "${notes}"
              ;;
            all)
              printf '## Changes\n- Updated Beszel Agent and Hub apps to version %s\n- Published Beszel Bridge version %s\n' \
                "${APP_VERSION}" "${BRIDGE_APP_VERSION}" > "${notes}"
              ;;
          esac
          printf '\n- Upstream release notes: https://github.com/henrygd/beszel/releases/tag/v%s\n' \
            "${BESZEL_VERSION}" >> "${notes}"
          gh release create "${RELEASE_TAG}" --title "${RELEASE_NAME}" --notes-file "${notes}" "${release_options[@]}"
