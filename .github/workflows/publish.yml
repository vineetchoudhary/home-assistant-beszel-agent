name: Build and Publish

on:
  # Check for new releases every 8 hours
  schedule:
    - cron: '0 */8 * * *'
  # Allow manual trigger with image type selection
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Image type to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hub
          - hub-dev
          - stable
          - dev
          - smart
      force_rebuild:
        description: 'Force rebuild even if version is up-to-date'
        required: false
        default: false
        type: boolean
  # Trigger on new tags/releases in this repo
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/publish.yml'
      - 'beszel_agent_dev/**'
      - 'beszel_hub/**'
      - 'beszel_hub_dev/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Determine trigger type
        id: trigger_type
        run: |
          # Determine which image to build based on changed files
          IMAGE_TYPE="all"
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != refs/tags/* ]]; then
            # Check which files changed
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
            
            if echo "$CHANGED_FILES" | grep -q "^beszel_agent_dev/"; then
              IMAGE_TYPE="dev"
              echo "Detected changes in beszel_agent_dev - building dev only"
            elif echo "$CHANGED_FILES" | grep -q "^beszel_hub_dev/"; then
              IMAGE_TYPE="hub-dev"
              echo "Detected changes in beszel_hub_dev - building hub dev only"
            elif echo "$CHANGED_FILES" | grep -q "^beszel_hub/"; then
              IMAGE_TYPE="hub"
              echo "Detected changes in beszel_hub - building hub only"
            fi
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "type=tag" >> $GITHUB_OUTPUT
            echo "This is a tag-based release - building all images with the Beszel version pinned in the repository"
            IMAGE_TYPE="all"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "type=scheduled" >> $GITHUB_OUTPUT
            echo "This is a scheduled check"
          else
            echo "type=manual" >> $GITHUB_OUTPUT
            echo "This is a manual trigger"
            # Use input image_type if provided, otherwise use detected IMAGE_TYPE
            if [[ -n "${{ inputs.image_type }}" ]]; then
              IMAGE_TYPE="${{ inputs.image_type }}"
            fi
            echo "Image type: ${IMAGE_TYPE}"
            echo "Force rebuild: ${{ inputs.force_rebuild || 'false' }}"
          fi
          
          echo "image_type=${IMAGE_TYPE}" >> $GITHUB_OUTPUT

      - name: Get latest release version
        id: get_version
        run: |
          # Use GitHub token to avoid rate limiting
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/henrygd/beszel/releases/latest)
          
          # Check if response is valid JSON
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Error: Failed to fetch release info from GitHub API"
            echo "$RESPONSE"
            exit 1
          fi
          
          VERSION=$(echo "$RESPONSE" | jq -r .tag_name)
          
          # Check if we got a valid version
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Could not extract version from API response"
            exit 1
          fi
          
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          echo "Latest Beszel version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Resolve add-on and upstream versions
        id: resolve_versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_ADDON_VERSION="$(grep '^version:' beszel_agent/config.yaml | sed -E 's/version: "(.*)"/\1/')"
          CURRENT_BESZEL_VERSION="$(tr -d '[:space:]' < beszel_agent/beszel_version)"
          LATEST_BESZEL_VERSION="${{ steps.get_version.outputs.VERSION }}"

          if [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
            ADDON_VERSION="${TAG_VERSION}"
            BESZEL_VERSION="${CURRENT_BESZEL_VERSION}"
            echo "Tag-based release detected"
            echo "Using add-on/image version from git tag: ${ADDON_VERSION}"
            echo "Using upstream Beszel version from repo state: ${BESZEL_VERSION}"
          elif [[ "${LATEST_BESZEL_VERSION}" != "${CURRENT_BESZEL_VERSION}" ]]; then
            ADDON_VERSION="${LATEST_BESZEL_VERSION}"
            BESZEL_VERSION="${LATEST_BESZEL_VERSION}"
            echo "Upstream Beszel update detected"
            echo "Using add-on/image version: ${ADDON_VERSION}"
            echo "Using upstream Beszel version: ${BESZEL_VERSION}"
          else
            ADDON_VERSION="${CURRENT_ADDON_VERSION}"
            BESZEL_VERSION="${CURRENT_BESZEL_VERSION}"
            echo "No upstream Beszel change detected"
            echo "Using add-on/image version: ${ADDON_VERSION}"
            echo "Using upstream Beszel version: ${BESZEL_VERSION}"
          fi

          echo "ADDON_VERSION=${ADDON_VERSION}" >> $GITHUB_OUTPUT
          echo "BESZEL_VERSION=${BESZEL_VERSION}" >> $GITHUB_OUTPUT

      - name: Check if config file version is up-to-date
        id: check_version
        run: |
          CONFIG_VERSION=$(grep '^version:' beszel_agent/config.yaml | sed -E 's/version: "(.*)"/\1/')
          echo "Config version: $CONFIG_VERSION"
          
          # For manual triggers with force_rebuild, always proceed
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            echo "Force rebuild enabled: Building images"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          # For tag-based releases, always build with the tag version
          elif [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
            echo "Tag-based release: Building add-on version ${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          # A manual run that names one add-on is an explicit request to build it,
          # so don't fall through to the "already up-to-date" skip.
          elif [[ "${{ steps.trigger_type.outputs.type }}" == "manual" && "${{ steps.trigger_type.outputs.image_type }}" != "all" ]]; then
            echo "Manual ${{ steps.trigger_type.outputs.image_type }} build requested"
            echo "run_steps=true" >> $GITHUB_OUTPUT
          elif [ "$CONFIG_VERSION" = "${{ steps.resolve_versions.outputs.ADDON_VERSION }}" ]; then
            echo "Version is up-to-date. Skipping further steps."
            echo "run_steps=false" >> $GITHUB_OUTPUT
          else
            echo "Version is outdated. Proceeding with updates."
            echo "run_steps=true" >> $GITHUB_OUTPUT
          fi
      - name: Get latest stable release version from this repository
        id: get_stable_version
        if: always()
        run: |
          # Fetch the latest stable release from this repository
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          
          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r .tag_name)
          
          if [ -n "${LATEST_RELEASE}" ] && [ "${LATEST_RELEASE}" != "null" ]; then
            LATEST_VERSION=$(echo "${LATEST_RELEASE}" | sed 's/^v//')
            echo "Latest stable release: ${LATEST_VERSION}"
            echo "VERSION=${LATEST_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "No stable release found"
            echo "VERSION=" >> $GITHUB_OUTPUT
          fi
      - name: Update add-on versions
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.ADDON_VERSION }}\"/" beszel_agent/config.yaml
          sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.ADDON_VERSION }}\"/" beszel_agent_dev/config.yaml
          sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.ADDON_VERSION }}\"/" beszel_agent_smart/config.yaml
          sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.ADDON_VERSION }}\"/" beszel_hub/config.yaml
          sed -i "s/^version:.*/version: \"${{ steps.resolve_versions.outputs.ADDON_VERSION }}\"/" beszel_hub_dev/config.yaml
          printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > beszel_agent/beszel_version
          printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > beszel_agent_dev/beszel_version
          printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > beszel_agent_smart/beszel_version
          printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > beszel_hub/beszel_version
          printf '%s\n' "${{ steps.resolve_versions.outputs.BESZEL_VERSION }}" > beszel_hub_dev/beszel_version
          printf '# Changelog\n\n[View GitHub release v%s](https://github.com/%s/releases/tag/v%s)\n' \
            "${{ steps.resolve_versions.outputs.ADDON_VERSION }}" \
            "${{ github.repository }}" \
            "${{ steps.resolve_versions.outputs.ADDON_VERSION }}" \
            > beszel_agent/CHANGELOG.md
          cp beszel_agent/CHANGELOG.md beszel_agent_dev/CHANGELOG.md
          cp beszel_agent/CHANGELOG.md beszel_agent_smart/CHANGELOG.md
          cp beszel_agent/CHANGELOG.md beszel_hub/CHANGELOG.md
          cp beszel_agent/CHANGELOG.md beszel_hub_dev/CHANGELOG.md
          echo "Updated add-on version to ${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          echo "Updated upstream Beszel version to ${{ steps.resolve_versions.outputs.BESZEL_VERSION }}"
        env:
          VERSION: ${{ steps.resolve_versions.outputs.ADDON_VERSION }}

      - name: Login to GitHub Container Registry
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.run_steps == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Prepare container build helper
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          cat > /tmp/build-addon-image.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          image_prefix="$1"
          context_dir="$2"
          version="$3"
          arch="$4"
          tag_latest="${5:-false}"
          output_mode="${6:-push}"

          case "${output_mode}" in
            push) output_flag="--push" ;;
            load) output_flag="--load" ;;
            *)
              echo "Unsupported output mode: ${output_mode}" >&2
              exit 1
              ;;
          esac

          case "${arch}" in
            amd64)
              platform="linux/amd64"
              build_from="ghcr.io/home-assistant/amd64-base:latest"
              ;;
            aarch64)
              platform="linux/arm64"
              build_from="ghcr.io/home-assistant/aarch64-base:latest"
              ;;
            *)
              echo "Unsupported architecture: ${arch}" >&2
              exit 1
              ;;
          esac

          image="${image_prefix}-${arch}"
          tags=(-t "${image}:${version}")

          if [[ "${tag_latest}" == "true" ]]; then
            tags+=(-t "${image}:latest")
          fi

          docker buildx build \
            --platform "${platform}" \
            --pull \
            --build-arg "BUILD_FROM=${build_from}" \
            --build-arg "BUILD_ARCH=${arch}" \
            --build-arg "BUILD_VERSION=${version}" \
            --label "io.hass.arch=${arch}" \
            --label "io.hass.version=${version}" \
            --label "io.hass.type=addon" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            "${tags[@]}" \
            "${output_flag}" \
            "${context_dir}"
          EOF

          chmod +x /tmp/build-addon-image.sh

      - name: Build amd64 Test Image
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'stable' || steps.trigger_type.outputs.image_type == '')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          /tmp/build-addon-image.sh \
            "ghcr.io/vineetchoudhary/home-assistant-beszel-agent" \
            "beszel_agent" \
            "${VERSION}" \
            "amd64" \
            "false"

      - name: Retag and push only latest-test
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'stable' || steps.trigger_type.outputs.image_type == '')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-agent-amd64"
          
          # Pull the versioned image
          docker pull "${IMAGE}:${VERSION}"
          
          # Tag as latest-test
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest-test"
          
          # Push only latest-test tag
          docker push "${IMAGE}:latest-test"
          
          # Remove the version tag from local
          docker rmi "${IMAGE}:${VERSION}" || true
          
          echo "Pushed ${IMAGE}:latest-test (version tag will be created later after tests pass)"

      - name: Test Beszel Agent Image (Stable)
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'stable' || steps.trigger_type.outputs.image_type == '')
        run: |
          echo "Testing stable beszel_agent image..."
          IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-agent-amd64:latest-test"
          
          # Pull the image
          docker pull "${IMAGE}"
          
          # Run the container with test environment variables
          CONTAINER_ID=$(docker run -d \
            -e BESZEL_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEVS7RCrzT7kxYP9+bcALqVpvX3apD8u7OOfwlGfYkXR test@github-actions" \
            -e BESZEL_HUB_URL="http://0.0.0.0" \
            -e BESZEL_TOKEN="test-token-for-ci" \
            "${IMAGE}")
          
          echo "Container ID: ${CONTAINER_ID}"
          
          # Wait for container to initialize
          sleep 5
          
          # Get container logs
          LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
          echo "Container logs:"
          echo "${LOGS}"
          
          # Check container exit code
          CONTAINER_STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
          EXIT_CODE=$(docker inspect "${CONTAINER_ID}" --format='{{.State.ExitCode}}')
          
          echo "Container status: ${CONTAINER_STATUS}"
          echo "Container exit code: ${EXIT_CODE}"
          
          # Check if container started correctly with test mode
          if echo "${LOGS}" | grep -q "Starting Beszel Agent"; then
            echo "✓ Container started successfully"
            if echo "${LOGS}" | grep -q "Using KEY from environment variable (test mode)"; then
              echo "✓ Container using test mode configuration"
            fi
            if echo "${LOGS}" | grep -q "Hub URL: http://0.0.0.0"; then
              echo "✓ Hub URL configured correctly"
            fi
            if echo "${LOGS}" | grep -q "Starting Beszel Agent on port 45876"; then
              echo "✓ Agent started on port 45876"
            fi
            if echo "${LOGS}" | grep -q "Data directory path=/var/lib/beszel-agent"; then
              echo "✓ Data directory initialized"
            fi
            
            # Check for binary execution errors
            if echo "${LOGS}" | grep -q "cannot execute: required file not found"; then
              echo "✗ Agent binary execution failed - architecture or library mismatch"
              docker stop "${CONTAINER_ID}" 2>/dev/null || true
              docker rm "${CONTAINER_ID}"
              exit 1
            fi
            
            # Verify agent is actually running (not just logs printed)
            if [ "${CONTAINER_STATUS}" = "running" ]; then
              echo "✓ Container is still running - agent process started successfully"
            else
              echo "✗ Container exited with code ${EXIT_CODE}"
              docker stop "${CONTAINER_ID}" 2>/dev/null || true
              docker rm "${CONTAINER_ID}"
              exit 1
            fi
            
            # Container should be running (or trying to connect to test hub)
            docker stop "${CONTAINER_ID}" 2>/dev/null || true
            docker rm "${CONTAINER_ID}"
            echo "✓ Test passed for stable image"
          else
            echo "✗ Container failed to start properly"
            docker rm "${CONTAINER_ID}"
            exit 1
          fi

      - name: Delete test image from registry
        if: always() && steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'stable' || steps.trigger_type.outputs.image_type == '')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          PACKAGE_NAME="home-assistant-beszel-agent-amd64"
          IMAGE="ghcr.io/vineetchoudhary/${PACKAGE_NAME}"
          
          echo "Deleting test image with version ${VERSION} from registry..."
          
          # Get all versions from registry
          VERSIONS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions")
          
          # Find the test image version ID (has the version tag)
          VERSION_ID=$(echo "${VERSIONS}" | jq -r ".[] | select(.metadata.container.tags[] | select(. == \"${VERSION}\")) | .id" | head -n 1)
          
          if [ -n "${VERSION_ID}" ] && [ "${VERSION_ID}" != "null" ]; then
            # Delete the test image version
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
            echo "Deleted test image version ${VERSION_ID}"
            
            # Restore latest tag from stable release
            STABLE_VERSION="${{ steps.get_stable_version.outputs.VERSION }}"
            if [ -n "${STABLE_VERSION}" ]; then
              echo "Restoring 'latest' tag to stable version: ${STABLE_VERSION}"
              
              # Pull the stable release version and tag as latest
              if docker pull "${IMAGE}:${STABLE_VERSION}" 2>/dev/null; then
                docker tag "${IMAGE}:${STABLE_VERSION}" "${IMAGE}:latest"
                docker push "${IMAGE}:latest"
                echo "Restored 'latest' tag to version ${STABLE_VERSION}"
              else
                echo "Could not pull version ${STABLE_VERSION} - latest tag not restored"
              fi
            else
              echo "No stable release found - latest tag not restored"
            fi
          else
            echo "Test image already removed or not found"
          fi

      - name: Publish Stable Images
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'stable' || steps.trigger_type.outputs.image_type == '')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          for ARCH in amd64 aarch64; do
            /tmp/build-addon-image.sh \
              "ghcr.io/vineetchoudhary/home-assistant-beszel-agent" \
              "beszel_agent" \
              "${VERSION}" \
              "${ARCH}" \
              "true"
          done

      - name: Publish S.M.A.R.T. Images
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'smart')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          for ARCH in amd64 aarch64; do
            /tmp/build-addon-image.sh \
              "ghcr.io/vineetchoudhary/home-assistant-beszel-agent-smart" \
              "beszel_agent_smart" \
              "${VERSION}" \
              "${ARCH}" \
              "true"
          done

      - name: Publish Dev Images
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'dev')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          for ARCH in amd64 aarch64; do
            /tmp/build-addon-image.sh \
              "ghcr.io/vineetchoudhary/home-assistant-beszel-agent-dev" \
              "beszel_agent_dev" \
              "${VERSION}" \
              "${ARCH}" \
              "true"
          done

      - name: Tag dev images with latest-dev and SHA
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'dev')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          SHA_SHORT=$(git rev-parse --short HEAD)
          
          # List of all supported architectures
          ARCHS=("aarch64" "amd64")
          
          echo "Tagging dev images with latest-dev and SHA ${SHA_SHORT}..."
          
          for ARCH in "${ARCHS[@]}"; do
            IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-agent-dev-${ARCH}"
            
            # Pull the latest image
            if docker pull "${IMAGE}:latest" 2>/dev/null; then
              # Tag with latest-dev and SHA
              docker tag "${IMAGE}:latest" "${IMAGE}:latest-dev"
              docker tag "${IMAGE}:latest" "${IMAGE}:${SHA_SHORT}"
              
              # Push all tags
              docker push "${IMAGE}:latest-dev"
              docker push "${IMAGE}:${SHA_SHORT}"
              
              echo "✓ Tagged ${ARCH} with latest-dev and ${SHA_SHORT}"
            else
              echo "⚠ Could not pull ${IMAGE}:latest - skipping tagging"
            fi
          done
          
          echo "Dev image tagging completed!"

      - name: Build amd64 Hub Test Image
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          /tmp/build-addon-image.sh \
            "ghcr.io/vineetchoudhary/home-assistant-beszel-hub" \
            "beszel_hub" \
            "${VERSION}" \
            "amd64" \
            "false" \
            "load"

      - name: Test Beszel Hub Image
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub')
        run: |
          echo "Testing beszel_hub image..."
          IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-hub-amd64:${{ steps.resolve_versions.outputs.ADDON_VERSION }}"

          CONTAINER_ID=$(docker run -d -p 18090:8090 "${IMAGE}")
          echo "Container ID: ${CONTAINER_ID}"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18090/api/health" >/dev/null 2>&1; then
              healthy=true
              echo "Health endpoint responded after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done

          LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
          echo "Container logs:"
          echo "${LOGS}"

          STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
          echo "Container status: ${STATUS}"

          if ! echo "${LOGS}" | grep -q "Starting Beszel Hub"; then
            echo "✗ beszel_hub container did not start correctly"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          if [ "${healthy}" != "true" ]; then
            echo "✗ beszel_hub health endpoint did not respond"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          if [ "${STATUS}" != "running" ]; then
            echo "✗ beszel_hub container is not running"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          docker rm -f "${CONTAINER_ID}" || true
          echo "✓ Test passed for beszel_hub image"

      - name: Publish Hub Images
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          for ARCH in amd64 aarch64; do
            /tmp/build-addon-image.sh \
              "ghcr.io/vineetchoudhary/home-assistant-beszel-hub" \
              "beszel_hub" \
              "${VERSION}" \
              "${ARCH}" \
              "true"
          done

      - name: Build amd64 Hub Dev Test Image
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub-dev')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          /tmp/build-addon-image.sh \
            "ghcr.io/vineetchoudhary/home-assistant-beszel-hub-dev" \
            "beszel_hub_dev" \
            "${VERSION}" \
            "amd64" \
            "false" \
            "load"

      - name: Test Beszel Hub Dev Image
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub-dev')
        run: |
          echo "Testing beszel_hub_dev image..."
          IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-hub-dev-amd64:${{ steps.resolve_versions.outputs.ADDON_VERSION }}"

          CONTAINER_ID=$(docker run -d -p 18091:8090 "${IMAGE}")
          echo "Container ID: ${CONTAINER_ID}"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18091/api/health" >/dev/null 2>&1; then
              healthy=true
              echo "Health endpoint responded after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done

          LOGS=$(docker logs "${CONTAINER_ID}" 2>&1)
          echo "Container logs:"
          echo "${LOGS}"

          STATUS=$(docker inspect "${CONTAINER_ID}" --format='{{.State.Status}}')
          echo "Container status: ${STATUS}"

          if ! echo "${LOGS}" | grep -q "Starting Beszel Hub"; then
            echo "✗ beszel_hub_dev container did not start correctly"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          if [ "${healthy}" != "true" ]; then
            echo "✗ beszel_hub_dev health endpoint did not respond"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          if [ "${STATUS}" != "running" ]; then
            echo "✗ beszel_hub_dev container is not running"
            docker rm -f "${CONTAINER_ID}" || true
            exit 1
          fi

          docker rm -f "${CONTAINER_ID}" || true
          echo "✓ Test passed for beszel_hub_dev image"

      - name: Publish Hub Dev Images
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub-dev')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          for ARCH in amd64 aarch64; do
            /tmp/build-addon-image.sh \
              "ghcr.io/vineetchoudhary/home-assistant-beszel-hub-dev" \
              "beszel_hub_dev" \
              "${VERSION}" \
              "${ARCH}" \
              "true"
          done

      - name: Tag hub dev images with latest-dev and SHA
        if: steps.check_version.outputs.run_steps == 'true' && (steps.trigger_type.outputs.image_type == 'all' || steps.trigger_type.outputs.image_type == 'hub-dev')
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          SHA_SHORT=$(git rev-parse --short HEAD)

          # List of all supported architectures
          ARCHS=("aarch64" "amd64")

          echo "Tagging hub dev images with latest-dev and SHA ${SHA_SHORT}..."

          for ARCH in "${ARCHS[@]}"; do
            IMAGE="ghcr.io/vineetchoudhary/home-assistant-beszel-hub-dev-${ARCH}"

            # Pull the latest image
            if docker pull "${IMAGE}:latest" 2>/dev/null; then
              # Tag with latest-dev and SHA
              docker tag "${IMAGE}:latest" "${IMAGE}:latest-dev"
              docker tag "${IMAGE}:latest" "${IMAGE}:${SHA_SHORT}"

              # Push all tags
              docker push "${IMAGE}:latest-dev"
              docker push "${IMAGE}:${SHA_SHORT}"

              echo "✓ Tagged ${ARCH} with latest-dev and ${SHA_SHORT}"
            else
              echo "⚠ Could not pull ${IMAGE}:latest - skipping tagging"
            fi
          done

          echo "Hub dev image tagging completed!"

      - name: Commit add-on version update
        if: steps.check_version.outputs.run_steps == 'true'
        run: |
          git config --global user.name "Developer Insider Bot"
          git config --global user.email "bot@developerinsider.co"
          
          # Add appropriate config files based on image type
          IMAGE_TYPE="${{ steps.trigger_type.outputs.image_type }}"
          case "$IMAGE_TYPE" in
            "hub")
              git add beszel_hub/config.yaml beszel_hub/beszel_version beszel_hub/CHANGELOG.md
              COMMIT_MSG="Update hub add-on ${ADDON_VERSION} to Beszel ${BESZEL_VERSION}"
              ;;
            "hub-dev")
              git add beszel_hub_dev/config.yaml beszel_hub_dev/beszel_version beszel_hub_dev/CHANGELOG.md
              COMMIT_MSG="Update hub dev add-on ${ADDON_VERSION} to Beszel ${BESZEL_VERSION}"
              ;;
            "dev")
              git add beszel_agent_dev/config.yaml beszel_agent_dev/beszel_version beszel_agent_dev/CHANGELOG.md
              COMMIT_MSG="Update dev add-on ${ADDON_VERSION} to Beszel ${BESZEL_VERSION}"
              ;;
            "smart")
              git add beszel_agent_smart/config.yaml beszel_agent_smart/beszel_version beszel_agent_smart/CHANGELOG.md
              COMMIT_MSG="Update smart add-on ${ADDON_VERSION} to Beszel ${BESZEL_VERSION}"
              ;;
            *)
              git add beszel_agent/config.yaml beszel_agent/beszel_version beszel_agent/CHANGELOG.md beszel_agent_dev/config.yaml beszel_agent_dev/beszel_version beszel_agent_dev/CHANGELOG.md beszel_agent_smart/config.yaml beszel_agent_smart/beszel_version beszel_agent_smart/CHANGELOG.md beszel_hub/config.yaml beszel_hub/beszel_version beszel_hub/CHANGELOG.md beszel_hub_dev/config.yaml beszel_hub_dev/beszel_version beszel_hub_dev/CHANGELOG.md
              # Create appropriate commit message based on trigger type
              if [[ "${{ steps.trigger_type.outputs.type }}" == "tag" ]]; then
                COMMIT_MSG="Release ${{ github.ref_name }}: Add-on ${ADDON_VERSION}, Beszel ${BESZEL_VERSION}"
              else
                COMMIT_MSG="Update add-on ${ADDON_VERSION} to Beszel ${BESZEL_VERSION}"
              fi
              ;;
          esac
          
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          
          # Don't push on tag releases (avoid recursion)
          if [[ "${{ steps.trigger_type.outputs.type }}" != "tag" ]]; then
            git push
          else
            echo "Skipping push for tag-based release"
          fi
        env:
          ADDON_VERSION: ${{ steps.resolve_versions.outputs.ADDON_VERSION }}
          BESZEL_VERSION: ${{ steps.resolve_versions.outputs.BESZEL_VERSION }}

      - name: Create Git Tag
        if: steps.check_version.outputs.run_steps == 'true' && steps.trigger_type.outputs.type != 'tag' && steps.trigger_type.outputs.image_type == 'all' && inputs.force_rebuild != true
        run: |
          VERSION="${{ steps.resolve_versions.outputs.ADDON_VERSION }}"
          TAG="v${VERSION}"
          
          git tag -a "${TAG}" -m "Release ${TAG}: Update to Beszel ${VERSION}"
          git push origin "${TAG}"
          
          echo "Created and pushed tag: ${TAG}"
        env:
          VERSION: ${{ steps.resolve_versions.outputs.ADDON_VERSION }}

      - name: Create GitHub Release
        if: steps.check_version.outputs.run_steps == 'true' && steps.trigger_type.outputs.type != 'tag' && steps.trigger_type.outputs.image_type == 'all' && inputs.force_rebuild != true
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.resolve_versions.outputs.ADDON_VERSION }}
          release_name: Release v${{ steps.resolve_versions.outputs.ADDON_VERSION }}
          body: |
            ## Changes
            - Updated Beszel add-ons to version ${{ steps.resolve_versions.outputs.ADDON_VERSION }}
            - Upstream release notes: https://github.com/henrygd/beszel/releases/tag/v${{ steps.resolve_versions.outputs.BESZEL_VERSION }}
          draft: false
          prerelease: false
