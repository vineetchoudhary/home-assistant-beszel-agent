name: Validate App Configuration

on:
  pull_request:
    paths:
      - 'beszel_agent*/**'
      - 'beszel_hub*/**'
      - 'beszel_bridge/**'
      - 'docs/dashboards/beszel/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/publish.yml'
  push:
    branches:
      - main
    paths:
      - 'beszel_agent*/**'
      - 'beszel_hub*/**'
      - 'beszel_bridge/**'
      - 'docs/dashboards/beszel/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build every image and run the smoke and Supervisor tests'
        required: false
        default: true
        type: boolean

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run static checks
        run: ./scripts/test-apps.sh --static

      - name: Lint app YAML
        run: |
          pip install --quiet yamllint
          for config in beszel_*/config.yaml; do
            echo "Checking ${config}..."
            yamllint -d '{rules: {document-start: disable, line-length: disable}}' "${config}"
          done

  agent-keys:
    name: Agent SSH authentication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Container test runner regressions
        run: python3 -B scripts/test-ci-runners.py

      - name: Agent key sources and SSH authorization
        run: python3 scripts/test-agent-keys.py

  integration:
    name: Build, smoke and Supervisor tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build every image, smoke test it, then test it against a mock Supervisor
        run: ./scripts/test-apps.sh --supervisor

      - name: End-to-end test (Hub + every Agent)
        run: ./scripts/test-e2e.sh --all-agents

  bridge-integration:
    name: Bridge and Home Assistant (Hub ${{ matrix.hub }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full
    strategy:
      fail-fast: false
      matrix:
        hub: ["0.20.0", "0.21.0", "0.21.1", "0.21.2"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bridge entities, hardware fixtures and dashboards
        run: python3 scripts/test-bridge-e2e.py --build --hub-version "${{ matrix.hub }}" --report .artifacts/bridge/report.json

      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-hub-${{ matrix.hub }}
          path: .artifacts/bridge/report.json
