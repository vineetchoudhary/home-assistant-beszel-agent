name: Validate Add-on Configuration

on:
  pull_request:
    paths:
      - 'beszel_agent*/**'
      - 'beszel_hub*/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'beszel_agent*/**'
      - 'beszel_hub*/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build every image and run the smoke and Supervisor tests'
        required: false
        default: true
        type: boolean

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run static checks
        run: ./scripts/test-addons.sh --static

      - name: Lint add-on YAML
        run: |
          pip install --quiet yamllint
          for config in beszel_*/config.yaml; do
            echo "Checking ${config}..."
            yamllint -d '{rules: {document-start: disable, line-length: disable}}' "${config}"
          done

  integration:
    name: Build, smoke and Supervisor tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build every image, smoke test it, then test it against a mock Supervisor
        run: ./scripts/test-addons.sh --supervisor

      - name: End-to-end test (Hub + every Agent)
        run: ./scripts/test-e2e.sh --all-agents
