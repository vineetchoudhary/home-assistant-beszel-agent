name: "Beszel Hub (Test)"
description: "Development version of Beszel Hub Add-on"
version: "0.18.8"
slug: "beszel-hub-dev"
url: "https://github.com/vineetchoudhary/home-assistant-beszel-agent/tree/dev"
init: false
startup: application
boot: auto
backup: cold
watchdog: "http://[HOST]:[PORT:8090]/api/health"
webui: "http://[HOST]:[PORT:8090]"
arch:
  - aarch64
  - amd64
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "Beszel Hub web UI and API. Also used by the Home Assistant watchdog; if you clear this port the watchdog cannot reach the add-on."
image: "ghcr.io/vineetchoudhary/home-assistant-beszel-hub-dev"
options:
  app_url: ""
  environment_vars: []
schema:
  app_url: str?
  environment_vars:
    - name: str
      value: str
map:
  - type: data
    read_only: false
    path: /var/lib/beszel-hub
