# Home Assistant Ingress front-end for the Beszel Hub.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $ingress_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $ingress_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

map $upstream_http_cache_control $ingress_cache_control {
    default '';
    ''      'no-store';
}

server {
    listen 8099 default_server;

    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ingress_forwarded_proto;
        proxy_set_header X-Forwarded-Host $ingress_forwarded_host;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;

        sub_filter_once off;
        sub_filter '"BASE_PATH":"__HUB_BASE__"' '"BASE_PATH":"$http_x_ingress_path/"';
        sub_filter 'href="__HUB_BASE__'         'href="$http_x_ingress_path/';
        sub_filter 'src="__HUB_BASE__'          'src="$http_x_ingress_path/';

        add_header Cache-Control $ingress_cache_control always;
    }
}
